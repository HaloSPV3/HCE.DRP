name: release

# TODO
# - Allow workflows to be driven by the project(s)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    name: Release
    # required for proper WPF builds/publishes
    runs-on: windows-latest
    needs: ci
    permissions:
      contents: write # publish a GitHub Release
      issues: write # comment on released issues
      packages: write # push packages to "HaloSPV3" GitHub Nuget Package Registry
      pull-requests: write # comment on released pull requests

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required by GitVersion
          submodules: "recursive"

      - run: corepack enable
      - name: Setup Node Cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable

      - run: yarn install --immutable
      # Dependents: Semantic Release

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            src/packages.lock.json
            src/packages-debug.lock.json

      - name: MSVC Problem Matcher
        uses: ammaraskar/msvc-problem-matcher@47189a176388253d16c6f0b79eee6274512b761a

      - name: Semantic Release
        id: semantic-release
        run: yarn run release
        env:
          DEBUG: semantic-release*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish-artifacts
          path: publish
