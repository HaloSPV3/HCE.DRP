name: ci
# This workflow demonstrates the minimal requirements for building, publishing, and packing the Solution

on:
  push:
    branches: [main, develop]
    paths:
      - "!**/*.md"
      - "!**/*.txt"
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  build:
    name: Build
    runs-on: windows-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        buildConfig: ["Release", "Debug"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - run: corepack enable
      - name: Setup Node Cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable

      - run: yarn install --immutable

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Build | .NET MSBuildCMake.SDK -> CMake -> Ninja -> MSVC (Windows) or MinGW-GCC (Linux, Mac)
        run: dotnet publish src --configuration ${{ matrix.buildConfig }} -v diag
