name: ci
# This workflow demonstrates the minimal requirements for building, publishing, and packing the Solution

on:
  push:
    branches: [main, develop]
    paths:
      - "!**/*.md"
      - "!**/*.txt"
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  ci:
    name: CI
    runs-on: windows-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        buildConfig: ["Release", "Debug"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # cache: yarn
          node-version-file: .nvmrc
      - run: corepack enable

      - run: yarn install --immutable

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          cache-dependency-path: |
            src/packages.lock.json
            src/packages-debug.lock.json

      - name: MSVC Problem Matcher
        uses: ammaraskar/msvc-problem-matcher@47189a176388253d16c6f0b79eee6274512b761a

      - name: Build | .NET MSBuildCMake.SDK -> CMake -> Ninja -> MSVC (Windows) or MinGW-GCC (Linux, Mac)
        run: dotnet publish src --configuration ${{ matrix.buildConfig }} -v diag
